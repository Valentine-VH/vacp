name: vacp
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: vacp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
      POSTGRES_DB: vacp
    ports:
      - "127.0.0.1:55439:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vacp -d vacp"]
      interval: 2s
      timeout: 3s
      retries: 15
  skill-scanner:
    build: ./scanner
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - ../../.skill-scanner-exchange/inbox:/exchange/inbox:ro
      - ../../.skill-scanner-exchange/outbox:/exchange/outbox
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1
    pids_limit: 48
    restart: unless-stopped
volumes:
  pgdata:
